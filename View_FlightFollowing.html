  function loadMessages(reg) {
    if (!_ffHasGoogleScriptRun_()) return;
    google.script.run
      .withSuccessHandler(function(messages) {
        state.messagesByReg[reg] = Array.isArray(messages) ? messages : [];
        renderMessages(reg);
      })
      .withFailureHandler(function() {})
      .getFlightFollowMessages(reg);
  }

  function renderMessages(reg) {
    var container = document.getElementById('ff-chat-' + safeId(reg));
    if (!container) return;
    var messages = state.messagesByReg[reg] || [];
    var showArchived = !!state.archivedVisibleByReg[reg];
    var archivedMessages = messages.filter(function(msg) { return _ffIsArchived_(reg, msg); });
    var visibleMessages = messages.filter(function(msg) {
      return showArchived ? _ffIsArchived_(reg, msg) : !_ffIsArchived_(reg, msg);
    }).slice().sort(function(a, b) {
      return String(b.timestamp || '').localeCompare(String(a.timestamp || ''));
    });
    var toggleBtn = document.getElementById('ff-chat-archived-toggle-' + safeId(reg));
    var metaHtml = '';
    if (state.ffSyncMeta && state.ffSyncMeta.syncTime) {
      var syncDate = new Date(state.ffSyncMeta.syncTime);
      var syncAgo = Math.floor((Date.now() - syncDate.getTime()) / 1000);
      var syncAgoStr = syncAgo < 60 ? syncAgo + 's' : (syncAgo < 3600 ? Math.floor(syncAgo / 60) + 'm' : Math.floor(syncAgo / 3600) + 'h');
      metaHtml = '<div class="ff-chat-meta">' +
        'Last sync: ' + syncAgoStr + ' ago | Inserted: ' + (state.ffSyncMeta.inserted || 0) + ' | Visible: ' + visibleMessages.length + ' | Archived: ' + archivedMessages.length +
      '</div>';
    }
    if (toggleBtn) {
      toggleBtn.textContent = showArchived ? 'Show active' : 'Show archived';
      toggleBtn.className = 'ff-chat-toggle-btn' + (showArchived ? ' active' : '');
    }
    if (!messages.length) {
      container.innerHTML = metaHtml + '<div class="ff-chat-empty">No messages yet.</div>';
      return;
    }
    if (!visibleMessages.length) {
      container.innerHTML = metaHtml + '<div class="ff-chat-empty">' + (showArchived ? 'No archived messages for this aircraft.' : 'No active messages. Use Show archived to review hidden items.') + '</div>';
      return;
    }
    container.innerHTML = metaHtml +
      '<table class="ff-chat-table">' +
        '<thead><tr>' +
          '<th class="ff-chat-col-dir">Dir</th>' +
          '<th class="ff-chat-col-reg">Reg</th>' +
          '<th class="ff-chat-col-time">Time</th>' +
          '<th>Message</th>' +
          '<th class="ff-chat-col-actions">Actions</th>' +
        '</tr></thead>' +
        '<tbody>' + visibleMessages.map(function(msg) {
          var direction = _ffDirectionLabel_(msg);
          var preview = _ffPreviewText_(msg);
          var messageKey = _ffMessageKey_(reg, msg);
          var encodedMessageKey = encodeURIComponent(messageKey);
          var archiveLabel = showArchived ? 'Restore' : 'Archive';
          return '<tr class="ff-chat-row">' +
            '<td><span class="ff-chat-dir-badge ' + direction.toLowerCase() + '">' + direction + '</span></td>' +
            '<td>' + esc(String(reg || '').toUpperCase()) + '</td>' +
            '<td>' + esc(_ffFormatZuluTime_(msg.timestamp)) + '</td>' +
            '<td>' +
              '<div class="ff-chat-message-preview">' + esc(preview || '(empty message)') + '</div>' +
            '</td>' +
            '<td>' +
              '<button type="button" class="ff-chat-row-btn" onclick="ffShowMessageDetails(\'' + esc(reg) + '\', \'' + encodedMessageKey + '\')">View</button> ' +
              '<button type="button" class="ff-chat-row-btn" onclick="ffToggleArchiveMessage(\'' + esc(reg) + '\', \'' + encodedMessageKey + '\')">' + archiveLabel + '</button>' +
            '</td>' +
          '</tr>';
        }).join('') + '</tbody>' +
      '</table>';

    _ffRefreshParsedHeaderForReg_(reg);
  }

  function _ffFindMessageByKey_(reg, messageKey) {
    var messages = state.messagesByReg[reg] || [];
    for (var i = 0; i < messages.length; i += 1) {
      if (_ffMessageKey_(reg, messages[i]) === messageKey) return messages[i];
    }
    return null;
  }

  window.ffToggleArchivedMessages = function(reg) {
    state.archivedVisibleByReg[reg] = !state.archivedVisibleByReg[reg];
    renderMessages(reg);
  };

  window.ffToggleArchiveMessage = function(reg, messageKey) {
    messageKey = decodeURIComponent(String(messageKey || ''));
    var msg = _ffFindMessageByKey_(reg, messageKey);
    if (!msg) return;
    _ffSetArchived_(reg, msg, !_ffIsArchived_(reg, msg));
    renderMessages(reg);
  };

  window.ffShowMessageDetails = function(reg, messageKey) {
    messageKey = decodeURIComponent(String(messageKey || ''));
    var msg = _ffFindMessageByKey_(reg, messageKey);
    var modal = document.getElementById('ff-message-modal');
    var body = document.getElementById('ff-message-modal-body');
    var displayMessage = _ffOperationalMessageText_(msg && msg.text);
    if (!msg || !modal || !body) return;
    body.innerHTML = '' +
      '<div class="ff-modal-grid">' +
        '<div class="ff-modal-field"><div class="ff-modal-label">Direction</div><div class="ff-modal-value">' + esc(_ffDirectionLabel_(msg)) + '</div></div>' +
        '<div class="ff-modal-field"><div class="ff-modal-label">Reg</div><div class="ff-modal-value">' + esc(String(reg || '').toUpperCase()) + '</div></div>' +
        '<div class="ff-modal-field"><div class="ff-modal-label">Time</div><div class="ff-modal-value">' + esc(_ffFormatZuluStamp_(msg.timestamp)) + '</div></div>' +
        '<div class="ff-modal-field"><div class="ff-modal-label">Archived</div><div class="ff-modal-value">' + (_ffIsArchived_(reg, msg) ? 'Yes' : 'No') + '</div></div>' +
        '<div class="ff-modal-field"><div class="ff-modal-label">From</div><div class="ff-modal-value">' + esc(msg.from || '') + '</div></div>' +
        '<div class="ff-modal-field"><div class="ff-modal-label">Subject</div><div class="ff-modal-value">' + esc(msg.subject || '') + '</div></div>' +
        '<div class="ff-modal-field"><div class="ff-modal-label">Verified</div><div class="ff-modal-value">' + (msg.verified ? 'Yes' : 'No') + '</div></div>' +
        '<div class="ff-modal-field"><div class="ff-modal-label">Message Key</div><div class="ff-modal-value">' + esc(messageKey) + '</div></div>' +
      '</div>' +
      '<div class="ff-modal-message"><div class="ff-modal-label">Message</div><pre>' + esc(displayMessage || msg.text || '') + '</pre></div>';
    modal.classList.add('open');
  };

  window.ffCloseMessageModal = function(evt) {
    if (evt && evt.target && evt.target !== evt.currentTarget) return;
    var modal = document.getElementById('ff-message-modal');
    if (modal) modal.classList.remove('open');
  };

  function loadSyncMetadata() {
    if (!_ffHasGoogleScriptRun_()) return;
    google.script.run
      .withSuccessHandler(function(meta) {
        if (!meta) return;
        state.ffSyncMeta = meta;
        var selectedKey = String(state.selectedFlightKey || '');
        if (selectedKey) {
          var reg = selectedKey.split('|')[0];
          renderMessages(reg);
        }
      })
      .withFailureHandler(function() {})
      .getFlightFollowSyncMetadata();
  }

  window.ffToggleCheck = function(key, field) {
    if (!state.checksByReg[key]) state.checksByReg[key] = { fuel: false, data: false };
    state.checksByReg[key][field] = !state.checksByReg[key][field];
    renderGrid();
  };

  window.ffSendChat = function(reg) {
    var input = document.getElementById('ff-chat-input-' + safeId(reg));
    if (!input) return;
    var text = String(input.value || '').trim();
    if (!text) return;

    var mission = null;
    var selectedKey = String(state.selectedFlightKey || '');
    if (selectedKey) {
      var selectedParts = selectedKey.split('|');
      if (String(selectedParts[0] || '') === String(reg || '')) {
        var selectedMissionId = String(selectedParts[1] || '');
        mission = (state.missionsByReg[reg] || []).find(function(m) {
          return String(m && m.missionId || '') === selectedMissionId;
        }) || null;
      }
    }
    if (!mission) {
      mission = (state.missionsByReg[reg] || [])[0] || null;
    }

    var payload = {
      reg: String(reg || '').trim().toUpperCase(),
      missionId: mission ? String(mission.missionId || '') : '',
      flightLegId: mission ? String(mission.flightLegId || '') : '',
      route: mission ? String(mission.routeSummary || mission.route || '') : '',
      sender: 'FlightFollowing UI',
      text: text
    };

    input.disabled = true;
    google.script.run
      .withSuccessHandler(function(res) {
        input.disabled = false;
        if (!res || !res.success) {
          if (window.M) M.toast({ html: 'Send failed.', classes: 'red darken-2', displayLength: 3000 });
          return;
        }
        if (!state.messagesByReg[reg]) state.messagesByReg[reg] = [];
        state.messagesByReg[reg].push({
          timestamp: res.timestamp || new Date().toISOString(),
          direction: 'OUTBOUND',
          from: 'dispatch@ui',
          subject: res.subject || '',
          text: text,
          previewText: text,
          verified: true
        });
        renderMessages(reg);
        input.value = '';
        if (window.M) M.toast({ html: 'Message sent to Flight Following inbox.', classes: 'green darken-2', displayLength: 2200 });
      })
      .withFailureHandler(function(err) {
        input.disabled = false;
        if (window.M) {
          var msg = (err && err.message) ? err.message : String(err || 'Unknown error');
          M.toast({ html: 'Send error: ' + esc(msg), classes: 'red darken-2', displayLength: 3800 });
        }
      })
      .sendFlightFollowMessage(payload);
  };

  window.ffSyncNow = function(reg) {
    if (!_ffHasGoogleScriptRun_()) return;
    var btn = document.getElementById('ff-chat-sync-' + safeId(reg));
    if (btn && btn.disabled) return;
    if (btn) {
      btn.disabled = true;
      btn.textContent = 'Syncing...';
    }

    google.script.run
      .withSuccessHandler(function(res) {
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Sync now';
        }
        loadSyncMetadata();
        loadMessages(reg);
        if (window.M) {
          var inserted = Number(res && res.insertedMessages || 0);
          M.toast({ html: 'Sync completed. Inserted ' + inserted + ' message(s).', classes: 'green darken-2', displayLength: 2200 });
        }
      })
      .withFailureHandler(function(err) {
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Sync now';
        }
        if (window.M) {
          var msg = (err && err.message) ? err.message : String(err || 'Unknown error');
          M.toast({ html: 'Sync error: ' + esc(msg), classes: 'red darken-2', displayLength: 3800 });
        }
      })
      .runFlightFollowManualSync({ days: 14, maxThreads: 120 });
  };

  function renderEmpty(msg) {
    var host = document.getElementById('ff-detail-host');
    if (host) host.innerHTML = '<div class="ff-empty-state">' + esc(msg) + '</div>';
  }

  function flightKey(reg, missionId) {
    return String(reg || '') + '|' + String(missionId || '');
  }

  function _ffMissionFromKey_(key) {
    var parts = String(key || '').split('|');
    var reg = String(parts[0] || '');
    var legOrMissionId = String(parts[1] || '');
    if (!reg || !legOrMissionId) return null;
    var missions = state.missionsByReg[reg] || [];
    return missions.find(function(m) {
      var compositeId = String((m && (m.flightLegId || m.missionId)) || '');
      var missionId = String((m && m.missionId) || '');
      return compositeId === legOrMissionId || missionId === legOrMissionId;
    }) || null;
  }

  function safeId(value) {
    return String(value || '').replace(/[^A-Za-z0-9]/g, '_');
  }

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // ── NOAA GOES-16 Satellite WX Overlay (NASA GIBS WMTS) ────────────────────
  var _GIBS_LAYERS = {
    geocolor: {
      label: 'GeoColor',
      url: 'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/GOES-East_ABI_GeoColor/default/{time}/GoogleMapsCompatible_Level7/{z}/{y}/{x}.png',
      maxNativeZoom: 7
    },
    ir: {
      label: 'IR Band 13',
      url: 'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/GOES-East_ABI_Band13_Clean_Infrared/default/{time}/GoogleMapsCompatible_Level6/{z}/{y}/{x}.png',
      maxNativeZoom: 6
    }
  };

  var _wxByKey = {};  // key → { enabled, frames, frameIdx, playing, timer, layer, pendingLayer, layerKey, opacity, mission }

  function _ffWxBuildUrl(layerKey, time) {
    var cfg = _GIBS_LAYERS[layerKey] || _GIBS_LAYERS.geocolor;
    return cfg.url.replace('{time}', time);
  }

  function _ffWxBuildTimes(numFrames, intervalMin) {
    var times = [];
    var interval = intervalMin * 60000;
    // Keep frames fresh while leaving enough ingest time for GIBS publishing.
    var latest = Math.floor((Date.now() - 30 * 60000) / interval) * interval;
    for (var i = numFrames - 1; i >= 0; i--) {
      var d = new Date(latest - i * interval);
      times.push(d.toISOString().replace(/\.\d{3}Z$/, 'Z'));
    }
    return times;
  }

  function _ffWxUpdateDisplay(key) {
    var ws = _wxByKey[key];
    if (!ws) return;
    var sreg = safeId(key.split('|')[0]);
    var timeEl = document.getElementById('ff-wx-time-' + sreg);
    if (timeEl && ws.frames.length) {
      var d   = new Date(ws.frames[ws.frameIdx]);
      var mon = String(d.getUTCMonth() + 1).padStart(2, '0');
      var day = String(d.getUTCDate()).padStart(2, '0');
      var hh  = String(d.getUTCHours()).padStart(2, '0');
      var mn  = String(d.getUTCMinutes()).padStart(2, '0');
      timeEl.textContent = mon + '/' + day + ' ' + hh + ':' + mn + 'Z';
    }
    var playBtn = document.getElementById('ff-wx-play-' + sreg);
    if (playBtn) playBtn.textContent = ws.playing ? '⏸' : '▶';
    var satLayerBtn = document.getElementById('ff-wx-layer-toggle-' + sreg);
    if (satLayerBtn) {
      satLayerBtn.textContent = ws.layerKey === 'ir' ? 'Infrared' : 'Visible';
      satLayerBtn.title = 'Switch Visible / Infrared';
    }
    var modeSel = document.querySelector('#ff-wx-controls-' + sreg + ' .ff-wx-select');
    if (modeSel) modeSel.value = ws.layerKey;
    var dotsEl = document.getElementById('ff-wx-dots-' + sreg);
    if (dotsEl && ws.frames.length) {
      var html = '';
      for (var i = 0; i < ws.frames.length; i++) {
        html += '<span style="display:inline-block;width:5px;height:5px;border-radius:50%;' +
          'margin:0 1px;background:' + (i === ws.frameIdx ? '#42a5f5' : '#37474f') + '"></span>';
      }
      dotsEl.innerHTML = html;
    }
  }

  function _ffWxRenderFrame(key) {
    var ws = _wxByKey[key];
    if (!ws || !ws.enabled || !ws.frames.length) return;
    var reg = key.split('|')[0];
    var map = state.satMapsByKey[key] || _ffInitSatMap(key, reg, ws.mission || null);
    if (!map) return;
    var cfg = _GIBS_LAYERS[ws.layerKey] || _GIBS_LAYERS.geocolor;
    var url = _ffWxBuildUrl(ws.layerKey, ws.frames[ws.frameIdx]);
    var nextLayer = L.tileLayer(url, {
      tileSize: 256,
      maxNativeZoom: cfg.maxNativeZoom || 6,
      maxZoom: 13,
      opacity: 0,
      attribution: 'NOAA GOES-16 / NASA GIBS',
      updateWhenIdle: true,
      keepBuffer: 2
    }).addTo(map);

    if (ws.pendingLayer) {
      try { map.removeLayer(ws.pendingLayer); } catch(e2) {}
      ws.pendingLayer = null;
    }
    ws.pendingLayer = nextLayer;

    nextLayer.on('load', function() {
      var current = _wxByKey[key];
      if (!current || current.pendingLayer !== nextLayer) return;
      nextLayer.setOpacity(current.opacity == null ? 0.85 : current.opacity);
      if (current.layer) {
        try { map.removeLayer(current.layer); } catch(e3) {}
      }
      current.layer = nextLayer;
      current.pendingLayer = null;
      _ffWxUpdateDisplay(key);
    });

    nextLayer.on('tileerror', function() {
      var current = _wxByKey[key];
      if (!current || current.pendingLayer !== nextLayer) return;
      try { map.removeLayer(nextLayer); } catch(e4) {}
      current.pendingLayer = null;
      if (!current.playing && current.frameIdx > 0) {
        current.frameIdx -= 1;
        _ffWxRenderFrame(key);
        return;
      }
      _ffWxUpdateDisplay(key);
    });

    if (!ws.layer) {
      nextLayer.setOpacity(ws.opacity == null ? 0.85 : ws.opacity);
      ws.layer = nextLayer;
      ws.pendingLayer = null;
      _ffWxUpdateDisplay(key);
    } else {
      _ffWxUpdateDisplay(key);
    }
  }

  function _ffBuildWxBar(key, sreg) {
    var k = esc(key);
    return '<div class="ff-wx-bar">' +
      '<button class="ff-wx-toggle" id="ff-wx-toggle-' + sreg + '" onclick="ffToggleWx(\'' + k + '\')">SAT &#9729;</button>' +
      '<span class="ff-wx-controls" id="ff-wx-controls-' + sreg + '" style="display:none;">' +
        '<button class="ff-wx-btn" id="ff-wx-layer-toggle-' + sreg + '" onclick="ffWxCycleLayer(\'' + k + '\')">Visible</button>' +
        '<button class="ff-wx-btn" id="ff-wx-play-' + sreg + '" onclick="ffWxPlayPause(\'' + k + '\')">&#9654;</button>' +
        '<button class="ff-wx-btn" onclick="ffWxStep(\'' + k + '\',-1)">&#9664;</button>' +
        '<button class="ff-wx-btn" onclick="ffWxStep(\'' + k + '\',1)">&#9654;&#9654;</button>' +
        '<span class="ff-wx-time" id="ff-wx-time-' + sreg + '">--/-- --:--Z</span>' +
        '<span id="ff-wx-dots-' + sreg + '" style="margin:0 3px;"></span>' +
        '<select class="ff-wx-select" onchange="ffWxSetLayer(\'' + k + '\',this.value)">' +
          '<option value="geocolor">Visible</option>' +
          '<option value="ir">Infrared</option>' +
        '</select>' +
        '<input type="range" min="0.25" max="1" step="0.05" value="0.85" class="ff-wx-opacity" title="Opacity" oninput="ffWxSetOpacity(\'' + k + '\',this.value)">' +
      '</span>' +
    '</div>';
  }

  window.ffToggleWx = function(key) {
    if (!_wxByKey[key]) {
      _wxByKey[key] = { enabled: false, frames: [], frameIdx: 0, playing: false, timer: null, layer: null, pendingLayer: null, layerKey: 'geocolor', opacity: 0.85, mission: null };
    }
    var ws = _wxByKey[key];
    ws.enabled = !ws.enabled;
    var sreg     = safeId(key.split('|')[0]);
    var btn      = document.getElementById('ff-wx-toggle-'   + sreg);
    var controls = document.getElementById('ff-wx-controls-' + sreg);
    var satWrap  = document.getElementById('ff-sat-wrap-' + sreg);
    var satEmpty = document.getElementById('ff-sat-empty-' + sreg);
    if (ws.enabled) {
      ws.frames   = _ffWxBuildTimes(8, 10);
      ws.frameIdx = ws.frames.length - 1;
      ws.mission  = _ffMissionFromKey_(key);
      if (btn)      { btn.classList.add('active'); btn.innerHTML = 'SAT &#9729; ON'; }
      if (controls) controls.style.display = '';
      if (satWrap) satWrap.classList.add('active');
      if (satEmpty) satEmpty.style.display = 'none';
      _ffEnsureLeaflet(function() {
        _ffInitSatMap(key, key.split('|')[0], ws.mission || null);
        var satMap = state.satMapsByKey[key];
        if (satMap) setTimeout(function(){ satMap.invalidateSize(); }, 60);
        _ffWxRenderFrame(key);
      });
    } else {
      if (ws.timer) { clearInterval(ws.timer); ws.timer = null; }
      ws.playing = false;
      var map = state.satMapsByKey[key];
      if (map && ws.layer) { try { map.removeLayer(ws.layer); } catch(e2) {} }
      if (map && ws.pendingLayer) { try { map.removeLayer(ws.pendingLayer); } catch(e3) {} }
      ws.layer = null;
      ws.pendingLayer = null;
      if (btn)      { btn.classList.remove('active'); btn.innerHTML = 'SAT &#9729;'; }
      if (controls) controls.style.display = 'none';
      if (satWrap) satWrap.classList.remove('active');
      if (satEmpty) satEmpty.style.display = '';
    }
  };

  window.ffWxStep = function(key, dir) {
    var ws = _wxByKey[key];
    if (!ws || !ws.enabled || !ws.frames.length) return;
    if (ws.playing) { window.ffWxPlayPause(key); }
    ws.frameIdx = (ws.frameIdx + dir + ws.frames.length) % ws.frames.length;
    _ffWxRenderFrame(key);
  };

  window.ffWxPlayPause = function(key) {
    var ws = _wxByKey[key];
    if (!ws || !ws.enabled) return;
    ws.playing = !ws.playing;
    if (ws.playing) {
      ws.timer = setInterval(function() {
        ws.frameIdx = (ws.frameIdx + 1) % ws.frames.length;
        _ffWxRenderFrame(key);
      }, 1800);
    } else {
      if (ws.timer) { clearInterval(ws.timer); ws.timer = null; }
    }
    _ffWxUpdateDisplay(key);
  };

  window.ffWxSetLayer = function(key, layerKey) {
    var ws = _wxByKey[key];
    if (!ws) return;
    ws.layerKey = layerKey;
    if (ws.enabled) {
      _ffWxRenderFrame(key);
    } else {
      _ffWxUpdateDisplay(key);
    }
  };

  window.ffWxCycleLayer = function(key) {
    var ws = _wxByKey[key];
    if (!ws) return;
    window.ffWxSetLayer(key, ws.layerKey === 'ir' ? 'geocolor' : 'ir');
  };

  window.ffWxSetOpacity = function(key, val) {
    var ws = _wxByKey[key];
    if (!ws) return;
    ws.opacity = Number(val);
    if (ws.layer) ws.layer.setOpacity(ws.opacity);
    if (ws.pendingLayer) ws.pendingLayer.setOpacity(0);
  };

})();
</script>
